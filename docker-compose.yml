version: '3.8'

services:
  # PostgreSQL para auth, clientes y ventas
  postgres_db:
    image: postgres:15-alpine
    container_name: srv_ventas_postgres
    restart: always
    environment:
      POSTGRES_USER: user_ventas
      POSTGRES_PASSWORD: password_ventas
      POSTGRES_MULTIPLE_DATABASES: "db_seguridad,db_clientes,db_ventas"
    ports:
      - "5433:5432" # Puerto host 5433 para evitar conflictos locales
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-postgres-databases.sh:/docker-entrypoint-initdb.d/init-multiple-postgres-databases.sh

  # MongoDB para productos
  mongo_db:
    image: mongo:6.0
    container_name: srv_ventas_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: mongosecret
      MONGO_INITDB_DATABASE: db_productos
    ports:
      - "27018:27017" # Puerto host 27018 para evitar conflictos locales
    volumes:
      - mongo_data:/data/db

  # Config Server
  config-server:
    build:
      context: .
      dockerfile: msrv-config/Dockerfile
    ports:
      - "8888:8888"
    environment:
      - CONFIG_REPO_PATH=file:/app/config-data
    volumes:
      - ./config-data:/app/config-data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/api-gateway/default"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microservicios
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      config-server:
        condition: service_healthy
      msrv-seguridad:
        condition: service_started
      msrv-clientes:
        condition: service_started
      msrv-productos:
        condition: service_started
      msrv-ventas:
        condition: service_started

  msrv-seguridad:
    build:
      context: .
      dockerfile: msrv-seguridad/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      config-server:
        condition: service_healthy
      postgres_db:
        condition: service_started

  msrv-clientes:
    build:
      context: .
      dockerfile: msrv-clientes/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      config-server:
        condition: service_healthy
      postgres_db:
        condition: service_started

  msrv-productos:
    build:
      context: .
      dockerfile: msrv-productos/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      config-server:
        condition: service_healthy
      mongo_db:
        condition: service_started

  msrv-ventas:
    build:
      context: .
      dockerfile: msrv-ventas/Dockerfile
    ports:
      - "8084:8084"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      config-server:
        condition: service_healthy
      postgres_db:
        condition: service_started
      msrv-productos:
        condition: service_started
      msrv-clientes:
        condition: service_started

volumes:
  postgres_data:
  mongo_data:
